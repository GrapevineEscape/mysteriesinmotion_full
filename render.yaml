services:
  - type: web
    name: mysteriesinmotion
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    # Free tier does not support pre-deploy commands. Migrations still run
    # because `npm start` is `prisma migrate deploy && next start`.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: mysteriesinmotion-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_SITE_DOMAIN
        value: mysteriesinmotion.com
      # Leave empty until play DNS resolves so the catalog stays on the apex.
      - key: PUBLIC_PLAY_DOMAIN
        value: ""
      - key: PUBLIC_COMING_SOON
        value: "true"
      # Set to .mysteriesinmotion.com after both hostnames point at this service.
      - key: SESSION_COOKIE_DOMAIN
        value: ""
      - key: APP_TIMEZONE
        value: America/Chicago
      - key: ADMIN_EMAIL
        sync: false
      - key: BOOKING_NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SQUARE_APPLICATION_ID
        sync: false
      - key: NEXT_PUBLIC_SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_GRADING_MODEL
        value: gpt-5.6-luna
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_SIGNED_URLS
        value: "false"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ASSET_BUCKET
        value: online-mystery-images

databases:
  - name: mysteriesinmotion-db
    plan: free
    region: ohio
    databaseName: mysteriesinmotion
    user: mysteriesinmotion
